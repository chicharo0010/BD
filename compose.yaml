services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pg-practica1
    restart: unless-stopped
    environment:
      POSTGRES_DB: practica1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: practical
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: pgdata_practica1